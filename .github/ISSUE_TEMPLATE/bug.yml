name: Bug report
description: Something is broken (not a false positive or a bypass).
title: "[BUG] <short description>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: ChromeOS / Windows / macOS / Linux + Chrome version.
      placeholder: ChromeOS 126
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Console / details
      description: Service-worker console output (chrome://extensions → Inspect views) if relevant.
    validations:
      required: false
