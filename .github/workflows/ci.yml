name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs write (only build-lists publishes).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install JS tooling
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check classifier
      - name: Ruff format check
        run: ruff format --check classifier

  node-tests:
    name: node-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Engine self-test (compiler + tail)
        run: node test/selftest.mjs
      - name: Popup aggregation
        run: node test/popup.mjs
      - name: Evasion detectors
        run: node test/detect.mjs

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install classifier deps
        # The playwright PACKAGE is enough for the unit tests; we never run
        # `playwright install`, so no browser binaries are downloaded.
        run: pip install -r classifier/requirements.txt
      - name: Classifier unit tests
        run: python -m pytest classifier/tests -q
      - name: Stage bundled model for parity
        # infer.mjs / infer_ref.py load classifier/dist/, which is gitignored
        # (dist/). The bundled extension/model/ is the same exported artifact, so
        # seed dist/ from it — parity tests JS-vs-Python agreement on one model.
        run: |
          mkdir -p classifier/dist
          cp extension/model/model.bin extension/model/model-meta.json classifier/dist/
      - name: Python <-> JS model parity (text vectorizer)
        env:
          FENCELINE_PYTHON: python
        run: node classifier/tests/test_parity.mjs
      - name: Python <-> JS fusion tree-walk parity
        env:
          FENCELINE_PYTHON: python
        run: node classifier/tests/test_fusion_parity.mjs
      - name: Python <-> JS decision-rule parity + shipped-model sync guard
        env:
          FENCELINE_PYTHON: python
        run: node classifier/tests/test_decision_parity.mjs
