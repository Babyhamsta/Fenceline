name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; no job here needs write (only build-lists publishes).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install JS tooling
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check classifier
      - name: Ruff format check
        run: ruff format --check classifier

  node-tests:
    name: node-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Engine self-test (compiler + tail)
        run: node test/selftest.mjs
      - name: Popup aggregation
        run: node test/popup.mjs
      - name: Evasion detectors
        run: node test/detect.mjs

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install classifier deps
        # The playwright PACKAGE is enough for the unit tests; we never run
        # `playwright install`, so no browser binaries are downloaded.
        run: pip install -r classifier/requirements.txt
      - name: Classifier unit tests
        run: python -m pytest classifier/tests -q
      - name: Python <-> JS model parity
        env:
          FENCELINE_PYTHON: python
        run: node classifier/tests/test_parity.mjs
